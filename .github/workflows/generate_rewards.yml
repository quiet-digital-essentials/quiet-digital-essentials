name: Generate Unlimited Contribution Certificates

on:
  pull_request:
    types: [closed]

jobs:
  generate-pdf:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Metadata Into Template
        run: |
          DEV_NAME="@${{ github.event.pull_request.user.login }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_HASH=$(echo "${{ github.event.pull_request.merge_commit_sha }}" | cut -c1-8)
          DATE_STR=$(date +'%B %d, %Y')

          # Replace template placeholders cleanly using native tools
          sed -e "s/@dev_username/$DEV_NAME/g" \
              -e "s/For successful optimization and submission of production code patch asset fixing core responsive layout issues./$PR_TITLE/g" \
              -e "s/QDE-9842X-SYS/QDE-${PR_HASH^^}/g" \
              -e "s/APPROVED \& VERIFIED/VERIFIED ON ${DATE_STR^^}/g" \
              ./templates/certificate_template.html > ./templates/active_compiled_cert.html

      - name: Convert HTML to PDF with Puppeteer
        run: |
          npm install puppeteer
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              const browser = await puppeteer.launch();
              const page = await browser.newPage();
              await page.goto('file://$PWD/templates/active_compiled_cert.html', { waitUntil: 'networkidle0' });
              await page.pdf({path: 'cert-${{ github.event.pull_request.user.login }}.pdf', format: 'A4'});
              await browser.close();
            })();
          "

      - name: Upload Printable Asset to Release Matrix
        uses: softprops/action-gh-release@v2
        with:
          tag_name: verified-credentials
          files: cert-${{ github.event.pull_request.user.login }}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
